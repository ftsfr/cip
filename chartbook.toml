[project]
name = "Covered Interest Parity Deviations"
description = "CIP deviations measuring arbitrage opportunities in currency markets"
contributors = [
    "Jeremy Bejarano",
    "Kunj Mehta",
]
repo_url = "https://github.com/ftsfr/cip"
copyright = "2025"
os_compatibility = [
    "Windows/Linux/MacOS (requires Bloomberg)",
]

[notebooks.summary_cip]
name = "summary_cip"
description = "Summary statistics and visualization of CIP deviations"
path = "_output/summary_cip.ipynb"
publishable = true

[dataframes.ftsfr_cip_spreads]
name = "ftsfr_cip_spreads"
description = "Daily CIP deviations for 8 currencies vs USD"
sources = [
    "Bloomberg FX",
]
providers = [
    "Bloomberg",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://bloomberg.com",
]
tags = [
    "CIP",
    "foreign exchange",
    "arbitrage",
    "currency",
]
access_types = [
    "Bloomberg Terminal",
]
license = "Bloomberg"
restrictions = "No"
pull_method = "Pulled from Bloomberg via xbbg"
path = "./_data/ftsfr_cip_spreads.parquet"
date_col = "ds"
docs = """
## CIP Deviations

Covered Interest Parity deviations in basis points.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Currency code (e.g., EUR, GBP, JPY) |
| ds | Date |
| y | CIP spread in basis points |

### Methodology

$$
CIP = 10000 × [i_d - (360/90)(ln F - ln S) - i_f]
$$

Where:
- i_d: Domestic (foreign currency) interest rate
- i_f: Foreign (USD) interest rate
- F: 3-month forward rate
- S: Spot rate

### Interpretation

- CIP = 0: No arbitrage (parity holds)
- CIP > 0: Borrowing USD is cheaper
- CIP < 0: Borrowing foreign currency is cheaper

### Currencies

AUD, CAD, CHF, EUR, GBP, JPY, NZD, SEK

### Data Source

Bloomberg FX spot rates, forward points, and OIS interest rates
"""

[charts.cip_deviations]
name = "CIP Deviations"
description = "Interactive time series of CIP deviations across currencies"
dataframe = "ftsfr_cip_spreads"
path = "./_output/cip_deviations.html"
tags = [
    "CIP",
    "foreign exchange",
    "arbitrage",
    "currency",
]
docs = """
## CIP Deviations Chart

Interactive time series showing Covered Interest Parity deviations for 8 currencies against USD.

### Interpretation
- **CIP = 0**: No arbitrage opportunity (parity holds)
- **CIP > 0**: Borrowing USD is relatively cheaper
- **CIP < 0**: Borrowing foreign currency is relatively cheaper

### Currencies
AUD, CAD, CHF, EUR, GBP, JPY, NZD, SEK
"""
